<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Den navíc — 24 otázek (varianta A)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0A0518; --bg2:#150A2E;
  --panel:rgba(255,255,255,.035);
  --line:rgba(255,255,255,.14);
  --txt:#F2EEFF; --txt2:#B9AEDC;
  --c1:#3FD9E8; --c2:#9A78FF; --c3:#FF6FB0; --c4:#58A6FF; --c5:#56DDA0;
  --r:20px;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Rubik","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.45; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(900px 600px at 15% -10%, rgba(63,217,232,.16), transparent 60%),
    radial-gradient(900px 600px at 85% 5%, rgba(154,120,255,.18), transparent 60%),
    radial-gradient(1000px 700px at 50% 110%, rgba(255,111,176,.12), transparent 60%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
}
.wrap{max-width:1280px; margin:0 auto; padding:24px 20px 120px}

/* ---------- hlavicka ---------- */
.top{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:34px}
.logo{
  font-weight:800; letter-spacing:.14em; font-size:14px; line-height:1.25;
  padding:10px 16px; border-radius:14px; text-transform:uppercase;
  border:1.5px solid rgba(63,217,232,.55); color:#BFF6FB;
  box-shadow:0 0 18px rgba(63,217,232,.18), inset 0 0 18px rgba(63,217,232,.08);
}
.logo span{display:block; color:#FF9ECB; letter-spacing:.22em; font-size:11px}
.prog{margin-left:auto; display:flex; align-items:center; gap:12px}
.bars{display:flex; gap:4px}
.bars i{width:14px; height:26px; border-radius:4px; background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.12)}
.bars i.on{background:linear-gradient(180deg,#5FE8F2,#2FB9CC); border-color:transparent;
  box-shadow:0 0 12px rgba(63,217,232,.55)}
.prog b{font-variant-numeric:tabular-nums; font-size:15px; color:#CFE9FF; font-weight:600}
.prog b i{font-style:normal; color:var(--txt2); font-weight:500}

/* ---------- otazka ---------- */
.q{max-width:900px; margin:0 auto 34px; text-align:center}
.eyebrow{
  display:inline-block; font-size:12px; letter-spacing:.2em; text-transform:uppercase;
  color:#9FE9F2; border:1px solid rgba(63,217,232,.35); border-radius:999px;
  padding:5px 14px; margin-bottom:18px;
}
h1{
  margin:0 0 12px; font-size:clamp(24px,3.4vw,40px); line-height:1.15;
  font-weight:800; letter-spacing:-.01em;
  text-shadow:0 0 28px rgba(154,120,255,.35);
}
.lead{margin:0; color:var(--txt2); font-size:16px}

/* ---------- karta (spolocne) ---------- */
.opt{
  position:relative; display:flex; gap:16px; cursor:pointer; text-align:left;
  background:var(--panel); border:1.5px solid var(--line); border-radius:var(--r);
  color:var(--txt); font:inherit; padding:0; overflow:hidden;
  transition:border-color .16s, transform .16s, box-shadow .16s, background .16s;
}
.opt::after{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  box-shadow:inset 0 0 0 0 var(--c); transition:box-shadow .16s;
}
.opt:hover,.opt:focus-visible{
  border-color:var(--c); background:rgba(255,255,255,.06);
  transform:translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,.35), 0 0 22px -6px var(--c);
  outline:none;
}
.opt[aria-pressed="true"]{border-color:var(--c); background:rgba(255,255,255,.08)}
.opt[aria-pressed="true"]::after{box-shadow:inset 0 0 0 2px var(--c)}
.opt:nth-child(1){--c:var(--c1)} .opt:nth-child(2){--c:var(--c2)}
.opt:nth-child(3){--c:var(--c3)} .opt:nth-child(4){--c:var(--c4)}
.opt:nth-child(5){--c:var(--c5)}
.art{color:var(--c); filter:drop-shadow(0 0 10px currentColor); flex:none}
.art svg{display:block; width:100%; height:100%}
.opt p{margin:0; color:#EDE8FF}

/* ---------- lista mockupu ---------- */
.dev{
  position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:9;
  display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center;
  background:rgba(12,6,30,.92); border:1px solid rgba(255,255,255,.16);
  border-radius:999px; padding:8px 10px; backdrop-filter:blur(10px);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.dev span{font-size:11px; letter-spacing:.16em; color:#8C82AE; text-transform:uppercase; padding:0 8px}
.dev button{
  font:inherit; font-size:13px; padding:7px 14px; border-radius:999px; cursor:pointer;
  background:transparent; color:#D9D2F5; border:1px solid rgba(255,255,255,.18);
}
.dev button:hover{background:rgba(255,255,255,.08)}
.dev button.on{background:#EDE8FF; color:#1A0E33; border-color:transparent; font-weight:600}
@media (max-width:620px){
  .dev{max-width:calc(100% - 20px); flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start;
       border-radius:16px; bottom:10px}
  .dev span{display:none}
  .dev button{white-space:nowrap; font-size:12px; padding:6px 11px}
  .top{gap:10px}
  .prog{margin-left:0}
  .bars i{width:10px; height:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.grid{display:grid; grid-template-columns:repeat(5,1fr); gap:16px; align-items:stretch}
.opt{flex-direction:column; padding:22px 16px 24px; text-align:center; align-items:center; gap:18px}
.art{width:132px; height:132px}
.opt p{font-size:16px; line-height:1.4}
@media (max-width:1080px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .opt:nth-child(5){grid-column:1 / -1}
}
@media (max-width:620px){
  .grid{grid-template-columns:1fr; gap:12px}
  .opt{flex-direction:row; text-align:left; align-items:center; padding:14px 16px; gap:14px}
  .opt:nth-child(5){grid-column:auto}
  .art{width:76px; height:76px}
}

.bars{gap:2px}
.bars i{width:6px; height:20px; border-radius:2px}
.opt p{min-height:0}
.summary{max-width:860px; margin:0 auto}
.summary h2{font-size:22px; margin:0 0 6px}
.summary .rows{display:flex; flex-direction:column; gap:8px; margin-top:22px}
.summary .row{display:flex; gap:14px; align-items:flex-start; padding:12px 16px;
  border:1.5px solid var(--line); border-radius:14px; background:var(--panel)}
.summary .row b{flex:none; width:28px; color:var(--txt2); font-variant-numeric:tabular-nums;
  font-weight:600; font-size:14px; padding-top:2px}
.summary .row span{color:#EDE8FF; font-size:15.5px}
.draftnote{margin:18px 0 0; padding:12px 16px; border-radius:12px;
  border:1px dashed rgba(255,255,255,.28); color:var(--txt2); font-size:14px}
.dev select{font:inherit; font-size:13px; padding:7px 10px; border-radius:999px;
  background:rgba(255,255,255,.06); color:#D9D2F5; border:1px solid rgba(255,255,255,.18)}
.dev select option{background:#1A0E33}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">Den navíc<span>24 hodin jen pro tebe</span></div>
    <div class="prog">
      <div class="bars" id="bars"></div>
      <b id="count"></b>
    </div>
  </header>
  <div id="screen"></div>
</div>

<nav class="dev">
  <span>Mockup</span>
  <select id="jump" aria-label="Skok na otázku"></select>
  <button type="button" id="shuffle" class="on">Míchání: zap</button>
  <button type="button" id="restart">Od začátku</button>
  <button type="button" id="dump">Vypsat odpovědi</button>
</nav>

\" r=\"104\" opacity=\".35\"/><path d=\"M63 184V104a39 39 0 0 1 78 0V184\"/><circle cx=\"123\" cy=\"140\" r=\"5\" fill=\"currentColor\"/><circle cx=\"160\" cy=\"128\" r=\"16\"/><path d=\"M133 171q27 -24 54 0\"/><path d=\"M136 176L184 176\"/></g></svg>"};
let qi = 0, shuffleOn = true, orders = {}, answers = {}, shownAt = 0, done = false;
const el = s => document.querySelector(s);

function orderFor(q){
  if(!shuffleOn) return q.options.map((_,i)=>i);
  if(!orders[q.id]){
    const a = q.options.map((_,i)=>i);
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    orders[q.id]=a;
  }
  return orders[q.id];
}

function pick(q, o, pos, shown){
  answers[q.id] = {
    question_id: q.id,
    selected_option_id: o.id,
    shown_position: pos + 1,
    shown_order: shown,
    response_time_ms: Date.now() - shownAt
  };
  if(qi < Q.length - 1){ qi++; render(); }
  else { done = true; render(); }
}

function render(){
  el('#jump').value = String(qi);
  if(done) return renderSummary();

  const q = Q[qi], ord = orderFor(q), opts = ord.map(i => q.options[i]);
  const shown = opts.map(o => o.id);

  el('#screen').innerHTML =
    '<div class="q">' +
      '<div class="eyebrow">Volba ' + (qi+1) + ' z ' + Q.length + '</div>' +
      '<h1>' + q.title + '</h1>' +
      '<p class="lead">' + q.lead + '</p>' +
    '</div><div class="grid" id="grid"></div>';

  el('#count').innerHTML = (qi+1) + ' <i>/ ' + Q.length + '</i>';
  el('#bars').innerHTML = Q.map((_,i)=>
    '<i class="'+(i <= qi ? 'on' : '')+'"></i>').join('');

  el('#grid').innerHTML = opts.map(o =>
    '<button class="opt" type="button" aria-pressed="false" data-id="'+o.id+'">' +
    '<span class="art">' + ICON[o.id] + '</span><p>' + o.text + '</p></button>').join('');

  el('#grid').querySelectorAll('.opt').forEach((b, pos) => {
    b.addEventListener('click', () => pick(q, opts[pos], pos, shown));
  });
  shownAt = Date.now();
  window.scrollTo({top:0});
}

function renderSummary(){
  const rows = Q.map((q,i)=>{
    const a = answers[q.id];
    const o = a && q.options.find(x=>x.id===a.selected_option_id);
    return '<div class="row"><b>'+(i+1)+'</b><span>'+(o ? o.text : '—')+'</span></div>';
  }).join('');
  el('#screen').innerHTML =
    '<div class="summary"><div class="eyebrow">Hotovo</div>' +
    '<h1>Takhle vypadal tvůj den navíc</h1>' +
    '<p class="lead">Tohle sis vybral/a ve všech ' + Q.length + ' situacích.</p>' +
    '<div class="rows">' + rows + '</div>' +
    '<p class="draftnote">Souhrnná obrazovka je zatím jen nástřel — finální podobu ' +
    'budeme ladit zvlášť.</p></div>';
  el('#count').innerHTML = Q.length + ' <i>/ ' + Q.length + '</i>';
  el('#bars').innerHTML = Q.map(()=>'<i class="on"></i>').join('');
}

el('#jump').innerHTML = Q.map((q,i)=>
  '<option value="'+i+'">Otázka '+(i+1)+'</option>').join('');
el('#jump').addEventListener('change', e => { done=false; qi = +e.target.value; render(); });
el('#shuffle').addEventListener('click', e => {
  shuffleOn = !shuffleOn; orders = {};
  e.target.textContent = shuffleOn ? 'Míchání: zap' : 'Míchání: vyp';
  e.target.classList.toggle('on', shuffleOn);
  render();
});
el('#restart').addEventListener('click', ()=>{
  qi=0; done=false; answers={}; orders={}; render();
});
el('#dump').addEventListener('click', ()=>{
  console.log(JSON.stringify(Object.values(answers), null, 2));
  alert('Odpovědi vypsané do konzole prohlížeče (F12).');
});
render();
</script>
</body>
</html>
