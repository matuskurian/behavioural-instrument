<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>&nbsp;</title>
  <!--
    Rubik, the typeface of the visual design. The stack in theme.css falls back
    to the system sans, so a blocked or slow font costs weight and nothing else.
    Open question: self-hosting would remove this third-party request from
    pupils' browsers and the failure mode with it.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!--
    ?v= is stamped with the commit sha at deploy time (.github/workflows).
    Without it, Pages serves these with max-age=600 while app.js fetches the
    content files with no-store — so for ten minutes after a deploy a browser
    can pair old code with new content, which shows up as bracketed string
    keys in front of whoever is using it.
  -->
  <link rel="stylesheet" href="theme.css?v=dev">
</head>
<body>
  <!--
    The entire UI is rendered into #app by app.js.
    Nothing participant-facing is written in this file: the <title> is set at
    runtime from content/strings.json so that it can be changed without a code
    edit (§4.4).
  -->
  <main id="app" class="app"></main>
  <script type="module" src="app.js?v=dev"></script>
</body>
</html>
